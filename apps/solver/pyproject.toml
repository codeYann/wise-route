[project]
name = "solver"
version = "1.0.0"
description = "Wise Route solver package"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "ortools>=9.15.6755",
    "pika>=1.3.2",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
